  <g transform="translate(865 350)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <text x="0" y="0" fill="#918A80" font-size="17" font-weight="700" letter-spacing="3">DESIGN LOGIC</text>
    <g transform="translate(0 46)"><circle cx="28" cy="28" r="28" fill="#742A28"/><text x="28" y="36" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">青</text><text x="76" y="23" fill="#272522" font-size="26" font-weight="700">青年侧影</text><text x="76" y="53" fill="#69645D" font-size="18">突出计算机学院青年学生的主体身份与行动姿态</text></g>
    <g transform="translate(0 138)"><circle cx="28" cy="28" r="28" fill="#9D3F38"/><text x="28" y="36" fill="#fff" font-size="23" font-weight="700" text-anchor="middle">3</text><text x="76" y="23" fill="#272522" font-size="26" font-weight="700">三道青声</text><text x="76" y="53" fill="#69645D" font-size="18">对应三期社区宣讲，并化作跨海传播的声音航线</text></g>
    <g transform="translate(0 230)"><circle cx="28" cy="28" r="28" fill="#742A28"/><path d="M13 22h30v20H13zM13 22l15 11 15-11" fill="none" stroke="#fff" stroke-width="3"/><text x="76" y="23" fill="#272522" font-size="26" font-weight="700">胸前侨批</text><text x="76" y="53" fill="#69645D" font-size="18">信封负形承载华侨史料、侨批记忆与史源整理</text></g>
    <g transform="translate(0 322)"><circle cx="28" cy="28" r="28" fill="#9D3F38"/><path d="M12 33c10-17 22-17 33-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="76" y="23" fill="#272522" font-size="26" font-weight="700">开放航线</text><text x="76" y="53" fill="#69645D" font-size="18">从社区课堂走进博物馆与侨批场馆，再回到长期传播</text></g>
    <g transform="translate(0 414)"><circle cx="28" cy="28" r="28" fill="#742A28"/><rect x="14" y="16" width="10" height="10" fill="#fff"/><rect x="28" y="28" width="10" height="10" fill="#fff"/><rect x="38" y="13" width="7" height="7" fill="#fff"/><text x="76" y="23" fill="#272522" font-size="26" font-weight="700">数字像素</text><text x="76" y="53" fill="#69645D" font-size="18">代表资料数字留存、科普网页建设与网络长效传播</text></g>
  </g>

  <g transform="translate(112 930)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
