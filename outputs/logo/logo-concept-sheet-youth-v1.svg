<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">青声传薪·数扬侨魂Logo设计说明板</title>
  <desc id="desc">青年团队标志、设计概念、标准色与使用示例。</desc>
  <defs>
    <mask id="youth-cut-b">
      <rect width="1000" height="1000" fill="#fff"/>
      <path d="M400 594H567M402 604L484 654L565 604" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="1800" height="1120" fill="#F8F1E7"/>
  <rect x="52" y="52" width="1696" height="1016" rx="32" fill="#FFFAF4" stroke="#E0D4C8"/>
  <text x="112" y="136" fill="#9D3F38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" letter-spacing="4">VISUAL IDENTITY · CONCEPT 01</text>
  <text x="112" y="226" fill="#272522" font-family="Noto Serif SC, Songti SC, Microsoft YaHei, serif" font-size="72" font-weight="700">让青年站在历史与数字之间</text>
  <text x="114" y="282" fill="#69645D" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24">一眼读到青年发声，再从负形读到侨批、寻访与数字传播。</text>

